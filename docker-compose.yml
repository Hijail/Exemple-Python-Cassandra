services:
  cassandra:
    image: cassandra:5.0
    container_name: etl-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: etl-local
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 90s
    volumes:
      - cassandra_data:/var/lib/cassandra
volumes:
  cassandra_data:
